<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Offers — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
<div id="page-content">
  <span class="eyebrow">Admin</span>
  <h1 class="section-title" style="font-size:26px">Offers</h1>
  <p style="color:var(--ink-soft); margin-top:6px">Create and manage promotional offers. Only ACTIVE offers inside their date window are visible to anyone else.</p>
  <div class="filters-bar"><button class="btn btn-primary btn-sm" id="newOfferBtn">+ New Offer</button></div>
  <div id="offersResults" style="margin-top:6px"></div>
  <div id="offerModal" style="display:none; position:fixed; inset:0; background:rgba(16,20,31,.5); z-index:60; align-items:center; justify-content:center">
    <div class="card" style="max-width:520px; width:92%; max-height:88vh; overflow-y:auto; background:#fff">
      <div class="card-row"><h3 id="offerFormTitle" style="font-size:16px">New Offer</h3><button id="closeOfferModal" class="btn btn-outline btn-sm">Close</button></div>
      <form id="offerForm">
        <input type="hidden" id="offerId">
        <div class="field"><label>Title</label><input type="text" id="oTitle" required></div>
        <div class="field"><label>Description</label><textarea id="oDescription"></textarea></div>
        <div class="field"><label>Price (e.g. ₹399)</label><input type="text" id="oPrice"></div>
        <div class="field"><label>Discount (optional)</label><input type="text" id="oDiscount"></div>
        <div class="field"><label>CTA button label</label><input type="text" id="oCtaLabel" value="Get Started"></div>
        <div class="field"><label>CTA link (URL)</label><input type="url" id="oCtaUrl" placeholder="https://"></div>
        <div class="field"><label>Start date</label><input type="date" id="oStart"></div>
        <div class="field"><label>End date</label><input type="date" id="oEnd"></div>
        <div class="field"><label>Status</label><select id="oStatus"><option>DRAFT</option><option>ACTIVE</option><option>EXPIRED</option><option>ARCHIVED</option></select></div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:18px" id="offerSubmitBtn">Save</button>
        <div class="alert" id="offerAlert"></div>
      </form>
    </div>
  </div>
</div>
<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/admin-offers.js"></script>
</body>
</html>
