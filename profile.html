<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>

<header class="auth-header" style="display:flex; justify-content:space-between; align-items:center">
  <a href="index.html" class="auth-brand"><span class="skill">Skill</span><span class="bridge">Bridge</span></a>
  <div style="display:flex; align-items:center; gap:18px">
    <a href="dashboard.html" style="font-size:13.5px; font-weight:600; color:var(--ink-soft)">← Dashboard</a>
    <button id="logoutBtn" class="auth-btn" style="width:auto; margin-top:0; padding:10px 20px; font-size:13.5px">Log Out</button>
  </div>
</header>

<main class="auth-main">
  <div class="profile-shell">
    <h1 style="font-size:26px">Your profile</h1>
    <p class="auth-sub">Keep your details up to date — this is what SkillBridge uses to research opportunities for you.</p>

    <form id="profileForm" novalidate>
      <div class="profile-grid">
        <div class="field-full">
          <label for="email">Email</label>
          <input type="email" id="email" disabled>
          <div class="field-hint">Your email is tied to your login and can't be changed here yet.</div>
        </div>

        <div class="field-full">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" autocomplete="name">
        </div>

        <div>
          <label for="phone">Phone</label>
          <input type="tel" id="phone" autocomplete="tel">
        </div>
        <div>
          <label for="country">Country</label>
          <input type="text" id="country">
        </div>

        <div>
          <label for="city">City</label>
          <input type="text" id="city">
        </div>
        <div>
          <label for="main_skill">Main skill</label>
          <input type="text" id="main_skill" placeholder="e.g. Web development">
        </div>
        <div>
          <label for="company">Company</label>
          <input type="text" id="company" placeholder="Optional">
        </div>

        <div class="field-full">
          <label for="avatar_url">Avatar image URL</label>
          <input type="url" id="avatar_url" placeholder="https://… (link to an image — no file upload yet)">
        </div>

        <div class="field-full">
          <label for="services">Services</label>
          <input type="text" id="services" placeholder="e.g. Website design, SEO, branding">
        </div>

        <div>
          <label for="portfolio_url">Portfolio</label>
          <input type="url" id="portfolio_url" placeholder="https://">
        </div>
        <div>
          <label for="experience">Experience</label>
          <input type="text" id="experience" placeholder="e.g. 3–5 years">
        </div>

        <div>
          <label for="target_industries">Target industries</label>
          <input type="text" id="target_industries" placeholder="e.g. Healthcare, Retail">
        </div>
        <div>
          <label for="target_countries">Target countries</label>
          <input type="text" id="target_countries">
        </div>

        <div class="field-full">
          <label for="preferred_market">Preferred market</label>
          <input type="text" id="preferred_market" placeholder="Local, international, or both">
        </div>
      </div>

      <button type="submit" class="auth-btn" id="saveBtn" style="max-width:220px">
        <span class="btn-text">Save Changes</span>
        <span class="spinner"></span>
      </button>

      <div class="alert" id="profileAlert"></div>
    </form>
  </div>
</main>

<footer class="auth-page-footer">© 2026 SkillBridge — Powered by ManavLab</footer>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/profile.js"></script>
</body>
</html>
