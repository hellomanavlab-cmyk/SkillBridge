<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Platform Settings — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>

<div id="page-content">
  <span class="eyebrow">Admin</span>
  <h1 class="section-title" style="font-size:26px">Platform Settings</h1>
  <div class="alert show alert-info" style="margin-top:14px">This is a structural placeholder — these settings are saved locally on this device only and don't yet affect the live platform. Wiring them to real enforcement (e.g. actual maintenance mode) is a future step. No secrets or API keys are ever stored here.</div>

  <div class="card" style="margin-top:18px; max-width:560px">
    <div class="field"><label>Platform name</label><input type="text" id="sPlatformName" value="SkillBridge"></div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; margin-bottom:0">
        <input type="checkbox" id="sMaintenance" style="width:auto"> Maintenance mode (display only — not enforced)
      </label>
    </div>
    <div class="field"><label>Default opportunity status for new entries</label>
      <select id="sDefaultOppStatus"><option value="ACTIVE">ACTIVE</option><option value="DRAFT">DRAFT</option></select>
    </div>
    <div class="field"><label>Default plan for new signups</label>
      <select id="sDefaultPlan" disabled><option>FREE (enforced by database trigger — not editable here)</option></select>
    </div>
    <button class="btn btn-primary" id="saveSettingsBtn" style="margin-top:16px">Save</button>
    <div class="alert" id="settingsAlert"></div>
  </div>
</div>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/admin-settings.js"></script>
</body>
</html>
