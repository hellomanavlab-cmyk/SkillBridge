<!DOCTYPE html>
<html lang="en">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refund & Cancellation Policy — SkillBridge</title>

<style>

/* SkillBridge premium visual refresh */
:root{--sb-ink:#10233f;--sb-blue:#173c72;--sb-teal:#159b91;--sb-mist:#f4f8fb;--sb-line:#e2eaf1;--sb-shadow:0 18px 48px rgba(16,35,63,.09)}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#f7fafc 0%,#fff 44%,#f5f8fb 100%)!important;color:var(--sb-ink)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;line-height:1.7}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88)!important;backdrop-filter:blur(18px);border-bottom:1px solid rgba(226,234,241,.9);box-shadow:0 5px 24px rgba(16,35,63,.04)}
.top .hbar{max-width:1160px;margin:auto;padding:13px 22px!important}
.top .hbar>a:first-child{font-weight:800;letter-spacing:.02em;color:var(--sb-ink)!important}
.top .hbar img{width:43px;height:43px;object-fit:contain;border-radius:50%;box-shadow:0 3px 12px rgba(16,35,63,.12)}
#menuBtn{border:1px solid var(--sb-line)!important;background:#fff!important;border-radius:13px!important;box-shadow:0 5px 16px rgba(16,35,63,.06)}
#menuPanel{border:1px solid var(--sb-line)!important;border-radius:18px!important;background:rgba(255,255,255,.98)!important;box-shadow:var(--sb-shadow)!important;padding:10px!important}
#menuPanel a{border-radius:11px;padding:10px 13px;transition:background .2s,color .2s}
#menuPanel a:hover{background:#edf7f6;color:var(--sb-blue)}
.wrap{width:min(1120px,calc(100% - 36px))!important;margin-inline:auto!important}
main.wrap{padding-top:34px!important;padding-bottom:42px!important}
.hero,.hero-s{position:relative;overflow:hidden;border:1px solid rgba(220,232,240,.9)!important;border-radius:28px!important;padding:clamp(30px,5vw,64px)!important;background:radial-gradient(circle at 88% 10%,rgba(21,155,145,.12),transparent 30%),linear-gradient(135deg,#fff 0%,#f0f6fb 100%)!important;box-shadow:var(--sb-shadow)!important}
.hero:after,.hero-s:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(21,155,145,.16);border-radius:50%;right:-90px;bottom:-130px;pointer-events:none}
.badge,.kicker{display:inline-flex!important;align-items:center;border:1px solid rgba(21,155,145,.22)!important;border-radius:999px!important;padding:7px 13px!important;background:#eaf7f5!important;color:#087e77!important;font-size:12px!important;font-weight:800!important;letter-spacing:.11em;text-transform:uppercase}
.hero h1,.hero-s h1{max-width:780px;font-size:clamp(36px,6vw,64px)!important;line-height:1.08!important;letter-spacing:-.045em!important;color:#10233f!important;margin:18px 0 14px!important}
.hero p,.hero-s p{max-width:700px;font-size:clamp(16px,2vw,19px)!important;color:#53657b!important;line-height:1.8!important}
.svc{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px!important;margin-top:25px!important}
.card,.section,.block{border:1px solid var(--sb-line)!important;border-radius:22px!important;background:rgba(255,255,255,.92)!important;padding:clamp(22px,3vw,32px)!important;box-shadow:0 12px 34px rgba(16,35,63,.055)!important}
.card{transition:transform .22s ease,box-shadow .22s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--sb-shadow)!important}
.card h2,.section h2,.block h2{color:var(--sb-ink)!important;letter-spacing:-.025em}
.price{color:#087e77!important;font-weight:800!important;font-size:20px!important}
.btn,button.btn{display:inline-flex!important;align-items:center;justify-content:center;gap:8px;border:1px solid #123c6d!important;border-radius:13px!important;padding:12px 19px!important;background:linear-gradient(135deg,#173c72,#102b52)!important;color:#fff!important;text-decoration:none!important;font-weight:750!important;box-shadow:0 8px 18px rgba(23,60,114,.17);transition:transform .2s,box-shadow .2s}
.btn:hover,button.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(23,60,114,.22)}
.btn.ghost{background:#fff!important;color:var(--sb-blue)!important;border-color:var(--sb-line)!important;box-shadow:none!important}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.note{border:1px solid #dcebe9!important;border-left:4px solid var(--sb-teal)!important;border-radius:16px!important;background:#f1faf8!important;padding:18px 20px!important;color:#41566b!important;margin-top:22px!important}
ol,ul{padding-left:1.35rem}li{padding-left:5px;margin:9px 0;color:#53657b}
input,textarea,select{border:1px solid #d9e3ec!important;border-radius:12px!important;padding:12px 14px!important;background:#fff!important;color:var(--sb-ink)!important;max-width:100%}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(21,155,145,.15)!important;border-color:var(--sb-teal)!important}
footer{background:#10233f!important;color:#eaf1f8!important;border-radius:28px 28px 0 0}
footer a{color:#d9e9f5!important;text-decoration:none}
footer a:hover{color:#72d5c9!important}
.footer-links{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:14px}
.sb-visual{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);align-items:center;gap:clamp(18px,4vw,48px);margin:26px 0}
.sb-visual img{width:100%;height:auto;max-height:440px;object-fit:contain;border-radius:24px;background:#f4f8fb}
.sb-visual-copy{padding:10px 4px}
.sb-visual-copy h2{font-size:clamp(24px,3vw,36px);line-height:1.2;letter-spacing:-.035em;color:var(--sb-ink)}
.sb-visual-copy p{color:#5a6b7f}
.sb-founder-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.75fr);align-items:center;gap:30px}
.sb-founder-photo{width:100%;max-height:430px;object-fit:cover;object-position:center 24%;border-radius:22px;box-shadow:0 18px 45px rgba(16,35,63,.18);border:5px solid rgba(255,255,255,.9)}
.sb-step-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}
.sb-step{padding:18px;border:1px solid var(--sb-line);border-radius:17px;background:#fff}
.sb-step strong{display:block;color:var(--sb-teal);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
@media(max-width:700px){.wrap{width:min(100% - 26px,1120px)!important}main.wrap{padding-top:18px!important}.top .hbar{padding:10px 13px!important}.hero,.hero-s{border-radius:21px!important;padding:27px 22px!important}.svc,.sb-visual,.sb-founder-hero{grid-template-columns:1fr}.sb-visual img{max-height:330px}.sb-founder-photo{max-height:420px;object-position:center 20%}.sb-step-row{grid-template-columns:1fr}.card,.section,.block{border-radius:18px!important;padding:21px!important}.btn{width:100%;min-height:46px}.actions{display:grid;grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.btn{transition:none}}

</style>
