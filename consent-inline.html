<style>.sb-consent{position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:16px;pointer-events:none;font-family:Inter,system-ui,sans-serif}
.sb-consent[hidden]{display:none}
.sb-consent-inner{pointer-events:auto;position:relative;max-width:980px;margin:0 auto;background:#fff;color:#10141f;border:1px solid #e8eaed;border-radius:16px;box-shadow:0 24px 60px -20px rgba(22,35,63,.35);padding:20px 22px;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;animation:sbConsentIn .35s ease both}
@keyframes sbConsentIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.sb-consent-inner{animation:none}}
.sb-consent-text{flex:1 1 420px;min-width:0}
.sb-consent-text h2{margin:0 0 6px;font:800 16px Manrope,system-ui,sans-serif;color:#16233f}
.sb-consent-text p{margin:0;font-size:13.5px;line-height:1.55;color:#4d5561}
.sb-consent-status{margin-top:8px!important;font-size:12.5px!important;color:#0e7a63!important;font-weight:600}
.sb-consent-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sb-btn{font:600 13.5px Inter,system-ui,sans-serif;padding:11px 18px;border-radius:999px;cursor:pointer;text-decoration:none;border:1.5px solid transparent;transition:transform .2s,box-shadow .2s,background .2s;line-height:1.2}
.sb-btn:hover{transform:translateY(-1px)}
.sb-btn:focus-visible,.sb-consent-close:focus-visible{outline:2px solid #16a891;outline-offset:2px}
.sb-btn-primary{background:#16233f;color:#fff}
.sb-btn-outline{background:#fff;color:#16233f;border-color:#16233f}
.sb-btn-link{background:transparent;color:#16233f;text-decoration:underline;padding-left:6px;padding-right:6px}
.sb-consent-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:#f4f6f7;color:#16233f;font-size:18px;cursor:pointer;pointer-events:auto}
@media (max-width:600px){
 .sb-consent{padding:10px}
 .sb-consent-inner{padding:16px;gap:14px}
 .sb-consent-actions{width:100%;flex-direction:column;align-items:stretch}
 .sb-btn{text-align:center;padding:13px 18px}
}
.linklike{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.linklike:hover{text-decoration:underline}
</style>
<script>(function(){
  var KEY='sb_cookie_consent', V=1, box=null, last=null;
  function read(){ try{ var v=JSON.parse(localStorage.getItem(KEY)); if(v && v.version===V && (v.optional==='accepted'||v.optional==='rejected')) return v; }catch(e){} return null; }
  function write(o){ try{ localStorage.setItem(KEY, JSON.stringify({version:V, essential:true, optional:o, savedAt:new Date().toISOString()})); }catch(e){} }
  function notify(){ var ok=(read()||{}).optional==='accepted'; (window.__sbListeners||[]).forEach(function(cb){ try{cb(ok);}catch(e){} }); }
  function hide(){ if(box) box.hidden=true; if(last){ last.focus(); last=null; } }
  function build(){
    var el=document.createElement('div'); el.className='sb-consent'; el.id='sbConsent';
    el.setAttribute('role','region'); el.setAttribute('aria-labelledby','sbConsentTitle'); el.hidden=true;
    el.innerHTML='<div class="sb-consent-inner"><button type="button" class="sb-consent-close" aria-label="Close" hidden>×</button>'+
      '<div class="sb-consent-text"><h2 id="sbConsentTitle">Your Privacy Matters</h2>'+
      '<p>We use cookies to help our website function properly, understand website usage, and improve your experience. You can accept or reject optional cookies at any time.</p>'+
      '<p class="sb-consent-status" hidden></p></div>'+
      '<div class="sb-consent-actions"><button type="button" class="sb-btn sb-btn-primary" data-act="accept">Accept</button>'+
      '<button type="button" class="sb-btn sb-btn-outline" data-act="reject">Reject All</button>'+
      '<a class="sb-btn sb-btn-link" href="cookie-policy.html">Cookie Policy</a></div></div>';
    el.addEventListener('click', function(e){
      var t=e.target.closest('[data-act]');
      if(t){ write(t.getAttribute('data-act')==='accept' ? 'accepted' : 'rejected'); hide(); notify(); }
      if(e.target.closest('.sb-consent-close')) hide();
    });
    document.body.appendChild(el); return el;
  }
  function show(reopened){
    box = box || build();
    var st = read();
    box.querySelector('.sb-consent-close').hidden = !reopened;
    var s = box.querySelector('.sb-consent-status');
    s.hidden = !(reopened && st);
    if (st) s.textContent = 'Current choice: optional cookies ' + st.optional + '. Essential storage is always on.';
    box.hidden = false;
    if (reopened) box.querySelector('[data-act="accept"]').focus();
  }
  window.SBConsent = {
    get: read,
    optionalAllowed: function(){ return (read()||{}).optional==='accepted'; },
    onChange: function(cb){ (window.__sbListeners=window.__sbListeners||[]).push(cb); cb(window.SBConsent.optionalAllowed()); },
    openPreferences: function(){ show(true); }
  };
  document.addEventListener('click', function(e){
    var t=e.target.closest('[data-cookie-prefs]');
    if (t){ e.preventDefault(); last=t; show(true); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape' && box && !box.hidden && !box.querySelector('.sb-consent-close').hidden) hide();
  });
  function start(){ if(!read()) show(false); notify(); }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();</script>
