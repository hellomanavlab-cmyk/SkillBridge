<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/app.css">
<style>
  @media print {
    .app-sidebar, .app-topbar, .no-print { display: none !important; }
    .app-main { margin-left: 0 !important; }
    body { background: #fff !important; }
  }
</style>
</head>
<body>

<div id="page-content">
  <div class="card-row no-print">
    <div>
      <span class="eyebrow">Reports</span>
      <h1 class="section-title" style="font-size:26px">Reports</h1>
      <p style="color:var(--ink-soft); margin-top:6px">Generated summaries of your actual SkillBridge data.</p>
    </div>
    <div style="display:flex; gap:10px">
      <select id="rangeSelect">
        <option value="7d">Last 7 days</option>
        <option value="30d" selected>Last 30 days</option>
        <option value="90d">Last 90 days</option>
        <option value="all">All time</option>
        <option value="custom">Custom range</option>
      </select>
      <button class="btn btn-outline btn-sm" id="csvBtn">Export CSV</button>
      <button class="btn btn-primary btn-sm" id="printBtn">Print / PDF</button>
    </div>
  </div>

  <div class="filters-bar no-print" id="customRangeBar" style="display:none">
    <input type="date" id="customFrom"> <span style="align-self:center; color:var(--ink-soft)">to</span> <input type="date" id="customTo">
    <button class="btn btn-outline btn-sm" id="applyCustomBtn">Apply</button>
  </div>

  <div id="reportOutput" style="margin-top:20px"></div>

  <p style="font-size:12.5px; color:var(--ink-soft); margin-top:20px; max-width:70ch">
    Analytics reflect activity recorded in your SkillBridge account. Metrics do not guarantee prospect responses, meetings, projects, sales, or revenue.
  </p>
</div>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/reports.js"></script>
</body>
</html>
