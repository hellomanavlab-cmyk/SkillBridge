<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>

<header class="auth-header">
  <a href="index.html" class="auth-brand"><span class="skill">Skill</span><span class="bridge">Bridge</span></a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter your email and we'll send you a link to reset it.</p>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <div class="field-err" id="emailErr"></div>
      </div>

      <button type="submit" class="auth-btn" id="forgotBtn">
        <span class="btn-text">Send Reset Link</span>
        <span class="spinner"></span>
      </button>

      <div class="alert" id="forgotAlert"></div>
    </form>

    <p class="auth-footer-link">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</main>

<footer class="auth-page-footer">© 2026 SkillBridge — Powered by ManavLab</footer>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/forgot-password.js"></script>
</body>
</html>
