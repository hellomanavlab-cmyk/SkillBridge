<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — SkillBridge</title>
<meta name="description" content="Log in to your SkillBridge account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>

<header class="auth-header">
  <a href="index.html" class="auth-brand"><span class="skill">Skill</span><span class="bridge">Bridge</span></a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Log in</h1>
    <p class="auth-sub">Welcome back. Enter your details to continue.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <div class="field-err" id="emailErr"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <div class="field-err" id="passwordErr"></div>
      </div>

      <div class="auth-links">
        <span></span>
        <a href="forgot-password.html" data-preserve-next>Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span class="btn-text">Log In</span>
        <span class="spinner"></span>
      </button>

      <div class="alert" id="loginAlert"></div>
    </form>

    <p class="auth-footer-link">Don't have an account? <a href="signup.html" data-preserve-next>Sign up</a></p>
  </div>
</main>

<footer class="auth-page-footer">© 2026 SkillBridge — Powered by ManavLab</footer>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/login.js"></script>
</body>
</html>
