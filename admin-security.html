<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Security / Audit — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>

<div id="page-content">
  <span class="eyebrow">Admin</span>
  <h1 class="section-title" style="font-size:26px">Security / Audit Log</h1>
  <p style="color:var(--ink-soft); margin-top:6px">Every administrative action taken on the platform.</p>

  <div class="filters-bar">
    <select id="actionFilter">
      <option value="">All actions</option>
      <option value="OPPORTUNITY_CREATED">Opportunity created</option>
      <option value="OPPORTUNITY_UPDATED">Opportunity updated</option>
      <option value="OPPORTUNITY_DELETED">Opportunity deleted</option>
      <option value="ACCOUNT_SUSPENDED">Account suspended</option>
      <option value="ACCOUNT_REACTIVATED">Account reactivated</option>
    </select>
  </div>

  <div id="auditResults" style="margin-top:14px"></div>
  <div class="pagination" id="pagination" style="display:none"></div>
</div>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/admin-security.js"></script>
</body>
</html>
