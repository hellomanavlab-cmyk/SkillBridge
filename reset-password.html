<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>

<header class="auth-header">
  <a href="index.html" class="auth-brand"><span class="skill">Skill</span><span class="bridge">Bridge</span></a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <div id="resetFormWrap">
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password">
          <div class="field-err" id="passwordErr"></div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
          <div class="field-err" id="confirmPasswordErr"></div>
        </div>

        <button type="submit" class="auth-btn" id="resetBtn">
          <span class="btn-text">Update Password</span>
          <span class="spinner"></span>
        </button>

        <div class="alert" id="resetAlert"></div>
      </form>
    </div>

    <div id="resetInvalid" style="display:none">
      <div class="alert show alert-error">This password reset link is invalid or has expired. Please request a new one.</div>
      <p class="auth-footer-link"><a href="forgot-password.html">Request a new reset link</a></p>
    </div>
  </div>
</main>

<footer class="auth-page-footer">© 2026 SkillBridge — Powered by ManavLab</footer>

<script type="module" src="src/supabase-client.js"></script>
<script type="module" src="src/pages/reset-password.js"></script>
</body>
</html>
